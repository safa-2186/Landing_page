<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
      @theme {
        /*FONTS*/
        --font-roboto-mono: "Roboto Mono", monospace;
        --font-lora: "Lora", serif;
      }
    </style>
    <style>
        html { scroll-behavior: smooth; }
    </style>
</head>
<body>
    <header class="relative flex justify-between items-center px-6 md:px-20 mt-10">
        <div class="text-[#7E8A4F] font-roboto-mono flex items-underline font-normal tracking-tight">
            <span class="text-4xl">COSME</span>
            <span class="text-sm">TIC</span>
        </div>
        <nav class="hidden md:block">
            <ul class="text-black font-lora flex gap-10 ">
                <li><a href="/shop.html" class="hover:text-[#7E8A4F]">Shop</a></li>
                <li><a href="#Our_Story" class="hover:text-[#7E8A4F]">Our Story</a></li>
                <li><a href="#FAQ" class="hover:text-[#7E8A4F]">FAQ</a></li>
                <li><a href="#Reviews" class="hover:text-[#7E8A4F]">Reviews</a></li>
            </ul>
        </nav>
        <div class="flex gap-6 items-center">
            <button id="cartBtn" aria-label="Open cart" class="group relative flex items-center cursor-pointer">
                <img src="assets/shopping_bag.svg">
                <span class="absolute top-full mt-2 left-1/2 -translate-x-1/2 whitespace-nowrap text-xs font-lora font-medium
                             text-white bg-[#484731] px-3 py-1 rounded-full
                             opacity-0 scale-95 pointer-events-none
                             group-hover:opacity-100 group-hover:scale-100
                             transition-all duration-150 z-10">Cart
                </span>
                <!--item count badge, hidden until items are added-->
                <span id="cartCount" class="hidden absolute -top-2 -right-2 bg-[#D9534F] text-white text-[10px] font-lora 
                    font-semibold rounded-full w-4 h-4 items-center justify-center">0
               </span>
            </button>
            <div class="md:hidden"><img src="assets/menu.svg" id="menuBtn" class="cursor-pointer"></div>
        </div>

       
        
        <nav id="mobileMenu" class="hidden absolute top-full left-0 w-full bg-white shadow-lg md:hidden z-50">
          <ul class="flex flex-col text-black font-lora">
            <li><a href="./shop.html" class="block px-6 py-4 hover:text-[#7E8A4F] hover:bg-gray-50">Shop</a></li>
            <li><a href="#About" class="block px-6 py-4 hover:text-[#7E8A4F] hover:bg-gray-50">About</a></li>
            <li><a href="#Features" class="block px-6 py-4 hover:text-[#7E8A4F] hover:bg-gray-50">Features</a></li>
            <li><a href="#FAQ" class="block px-6 py-4 hover:text-[#7E8A4F] hover:bg-gray-50">FAQ</a></li>
            <li><a href="#Reviews" class="block px-6 py-4 hover:text-[#7E8A4F] hover:bg-gray-50">Reviews</a></li>
          </ul>
        </nav>

    </header>

    <!--Cart overlay-->
    <div id="cartOverlay" class="fixed inset-0 bg-[#00000066] opacity-0 pointer-events-none 
    transition-opacityduration-300 z-40"></div>

    <!--Cart panel-->
    <div id="cartPanel" class="fixed top-0 right-0 h-full w-full max-w-sm bg-white text-[#484731]
    translate-x-full transition-transform duration-300 ease-out z-50 p-8 shadow-2xl font-lora overflow-y-auto">

       <button id="cartCloseBtn" aria-label="Close cart" class="float-right text-2xl text-[#686963] hover:text-[#484731] cursor-pointer">&times;</button>
       <h2 class="text-2xl text-[#7E8A4F] font-medium ">Shopping Cart</h2>
       <div id="cartItemsWrapper" class="mt-10">

        <p id="cartEmptyMsg" class="text-sm text-[#686963]">Your cart is currently empty.</p>
        <ul id="cartItemsList" class="space-y-6 hidden"></ul>

       </div>

       <div id="cartFooter" class="hidden mt-8 pt-6 border-t border-[#E1E5D2]">

          <div class="flex justify-between text-base font-medium">
            <span>Subtotal</span>
            <span id="cartSubtotal">$0.00</span>
          </div>
          <button class="w-full bg-[#7E8A4F] text-white py-3 mt-6 shadow-md hover:shadow-lg hover:bg-[#6b7643] cursor-pointer transition">Checkout</button>

       </div>

    </div>
